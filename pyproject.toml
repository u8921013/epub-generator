[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epubgen"
version = "0.1.0"
description = "把圖片或 Markdown 資料夾轉成 EPUB"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "markdown-it-py>=3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
epubgen = "epubgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
